name: Publish

# A tag is the trigger, because a tag is what a release IS: the version in the manifest
# and the point in history it was built from, agreeing. Publishing on every push to main
# would make the registry's version numbers meaningless.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What lets npm attest where this came from, so the package page says "Built and
      # signed on GitHub Actions" and links to the exact commit.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      # Nothing is published that does not pass. A broken version cannot be replaced: npm
      # versions are immutable, so the fix is always a new number.
      - run: npm test
      - run: npm run typecheck

      # The tag and the manifest have to say the same thing. Tagging 1.0.1 with 1.0.0 in
      # package.json publishes 1.0.0 again, which fails with a confusing "cannot publish
      # over previously published version" long after the mistake was made.
      - name: The tag matches the version
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
            exit 1
          fi

      # `--provenance` is what the id-token permission above is for. `access` is already
      # in publishConfig, and it matters: a scoped package is private by default and npm
      # refuses it with a 402, which reads exactly like a billing problem and is not one.
      #
      # NODE_AUTH_TOKEN is needed for the FIRST publish. Afterwards, npm's trusted
      # publishing can be configured on the package's settings page to trust this
      # repository and this workflow, and then the secret can be deleted entirely.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
